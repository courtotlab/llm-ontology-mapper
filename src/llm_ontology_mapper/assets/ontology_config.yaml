# Ontology Configuration for Entity Type Mapping
# 
# This configuration defines which ontologies are recommended for each entity type.
# Each entity type can have multiple recommended ontologies listed in priority order.
#
# Supported ontologies:
# - HPO: Human Phenotype Ontology (symptoms, clinical features)
# - MONDO: Mondo Disease Ontology (diseases)
# - NCIT: NCI Thesaurus (cancer and clinical terms)
# - LOINC: Logical Observation Identifiers Names and Codes (lab tests, measurements)
# - UO: Units of Measurement Ontology
# - ICD10: International Classification of Diseases
# - CHEBI: Chemical Entities of Biological Interest (medications, chemicals)
# - SNOMED: SNOMED Clinical Terms
# - RxNorm: Normalized names for medications
# - EFO: Experimental Factor Ontology

# Ontology metadata
#
# retrieval:
#   The single authoritative home for "which public retrieval source serves
#   this ontology". `source` must be a key registered in
#   llm_ontology_mapper.retrieval_sources.registry. `source_ontology_id` is
#   the identifier to pass to that source's adapter; when omitted it defaults
#   to this ontology's own config key (most sources use the mapper's
#   canonical name as-is -- SNOMED-CT is the one existing exception, since
#   OLS4 knows it as "SNOMED" not "SNOMED-CT"). `aliases` lists additional
#   raw ontology spellings (beyond canonical_ontology()'s own prefix_aliases)
#   that should resolve to this same retrieval entry -- used only for
#   retrieval routing, not for global ontology identity.
ontologies:
  HPO:
    full_name: "Human Phenotype Ontology"
    description: "Standardized vocabulary for phenotypic abnormalities"
    curie_prefix: "HP"
    use_cases:
      - "Symptoms and clinical signs"
      - "Phenotypic features"
      - "Clinical observations"
    retrieval:
      source: ols4

  MONDO:
    full_name: "Mondo Disease Ontology"
    description: "Disease and disorder classification"
    curie_prefix: "MONDO"
    use_cases:
      - "Disease diagnoses"
      - "Medical conditions"
      - "Comorbidities"
    retrieval:
      source: ols4

  NCIT:
    full_name: "NCI Thesaurus"
    description: "Cancer and clinical terminology"
    curie_prefix: "NCIT"
    use_cases:
      - "Cancer types"
      - "Treatments and procedures"
      - "Clinical trials terminology"
    retrieval:
      source: ols4

  LOINC:
    full_name: "Logical Observation Identifiers Names and Codes"
    description: "Laboratory and clinical observations"
    curie_prefix: "LOINC"
    use_cases:
      - "Laboratory tests"
      - "Vital signs"
      - "Clinical measurements"
    retrieval:
      source: loinc

  UO:
    full_name: "Units of Measurement Ontology"
    description: "Standardized units of measurement"
    curie_prefix: "UO"
    use_cases:
      - "Measurement units"
      - "Quantities and dimensions"
    retrieval:
      source: ols4

  ICD10:
    full_name: "International Classification of Diseases, 10th Revision"
    description: "WHO disease classification system"
    curie_prefix: "icd10"
    use_cases:
      - "Disease coding for billing"
      - "Diagnosis classification"
    retrieval:
      source: nih_clinical_tables
      aliases: [ICD, "ICD-10", "ICD-10-CM"]

  SNOMED-CT:
    full_name: "SNOMED Clinical Terms"
    description: "Comprehensive clinical terminology"
    curie_prefix: "snomedct"
    use_cases:
      - "Clinical findings"
      - "Procedures"
      - "Medications"
      - "Chemical compounds"
      - "Biochemical entities"
    retrieval:
      source: ols4
      # OLS4's own ontology id for SNOMED CT is "snomed", not "snomed-ct".
      source_ontology_id: SNOMED
      aliases: [SNOMED, SNOMEDCT]

  RxNorm:
    full_name: "RxNorm"
    description: "Normalized names for clinical drugs"
    curie_prefix: "RXNORM"
    use_cases:
      - "Medication names"
      - "Drug prescriptions"
    retrieval:
      source: rxnav
      aliases: [RXNORM, RXNAV, RXCUI]

  EFO:
    full_name: "Experimental Factor Ontology"
    description: "Ontology for experimental variables and biomedical study factors"
    curie_prefix: "EFO"
    use_cases:
      - "Experimental factors"
      - "Biomedical study variables"
    retrieval:
      source: ols4

  UBERON:
    full_name: "Uberon Multi-species Anatomy Ontology"
    description: "Cross-species anatomical structures"
    curie_prefix: "UBERON"
    use_cases:
      - "Anatomical structures"
    retrieval:
      source: ols4

  CHEBI:
    full_name: "Chemical Entities of Biological Interest"
    description: "Chemical entities and their roles"
    curie_prefix: "CHEBI"
    use_cases:
      - "Chemicals and drugs"
    retrieval:
      source: ols4

  GO:
    full_name: "Gene Ontology"
    description: "Gene product functions, processes, and cellular components"
    curie_prefix: "GO"
    use_cases:
      - "Molecular functions"
      - "Biological processes"
    retrieval:
      source: ols4

  DOID:
    full_name: "Human Disease Ontology"
    description: "Human disease classification"
    curie_prefix: "DOID"
    use_cases:
      - "Disease classification"
    retrieval:
      source: ols4

  MESH:
    full_name: "Medical Subject Headings"
    description: "NLM controlled vocabulary thesaurus"
    curie_prefix: "MESH"
    use_cases:
      - "Biomedical literature indexing terms"
    retrieval:
      source: ols4

# =============================================================================
# PREFIX ALIASES
# =============================================================================
# Maps alternative/external prefixes to canonical ontology keys
# Used for normalizing LLM outputs and external API responses
prefix_aliases:
  # HPO variations
  HPO: HPO
  HP: HPO
  
  # SNOMED-CT variations (LLMs often use SCTID)
  SCTID: SNOMED-CT
  SNOMED: SNOMED-CT
  SNOMEDCT: SNOMED-CT
  "SNOMED-CT": SNOMED-CT
  
  # LOINC variations
  LOINC: LOINC
  
  # MONDO variations
  MONDO: MONDO
  
  # NCIT variations
  NCIT: NCIT
  
  # RxNorm variations (external systems use RXCUI)
  RXNORM: RxNorm
  RXCUI: RxNorm
  
  # ICD10 variations
  ICD10: ICD10
  ICD10CM: ICD10
  
  # UO variations
  UO: UO
  
  # UBERON variations
  UBERON: UBERON
  
  # CHEBI variations
  CHEBI: CHEBI

  # EFO variations
  EFO: EFO

# =============================================================================
# EXTERNAL API MAPPINGS
# =============================================================================
# NOTE: OLS4 ontology ids live on each ontology's own `retrieval` block above
# (source_ontology_id). `ols_api_map`, `bioportal_api_map`, and
# `sapbert_index_map` blocks used to live here as second, unused copies of
# data actually owned elsewhere (SearchTools.OLS_ONTOLOGY_MAP and
# local_retriever.py's _SAPBERT_INDEX_MAP) -- none were ever read by
# production code, so they were removed rather than kept as dead config.

# Entity type to ontology mappings
# Each entity type has a list of recommended ontologies in priority order
entity_ontology_mapping:
  # Clinical Features and Symptoms
  phenotype:
    ontologies: ["HPO"]
    primary: "HPO"
    description: "Phenotypic features and observable characteristics"
  
  comorbidity:
    ontologies: ["MONDO", "ICD10"]
    primary: "MONDO"
    description: "Concurrent medical conditions"
  
  # Treatments and Interventions
  medication:
    ontologies: ["RxNorm", "NCIT"]
    primary: "RxNorm"
    description: "Medications and drug treatments"
  
  procedure:
    ontologies: ["NCIT", "SNOMED-CT"]
    primary: "SNOMED-CT"
    description: "Medical procedures"
  
  # Laboratory and Measurements
  measurement:
    ontologies: ["LOINC"]
    primary: "LOINC"
    description: "Clinical measurements and observations"
  
  # Exposures and Environmental Factors
  exposure:
    ontologies: ["SNOMED-CT"]
    primary: "SNOMED-CT"
    description: "Environmental and chemical exposures"
  
  # Biological Samples
  specimen:
    ontologies: ["NCIT"]
    primary: "NCIT"
    description: "Biological specimens"
  
  sample:
    ontologies: ["NCIT", "SO"]
    primary: "NCIT"
    description: "Biological samples"
  
  # Default fallback
  default:
    ontologies: ["HPO", "MONDO", "NCIT"]
    primary: "HPO"
    description: "Default ontology recommendations"


# Custom study-specific overrides (optional)
# You can add study-specific configurations here
study_overrides:
  # Example:
  # HostSeq:
  #   phenotype:
  #     ontologies: ["HPO", "SNOMED-CT", "MONDO"]
  #     primary: "HPO"
