# ─────────────────────────────────────────────────────────────────────────────
# CI — test matrix across Python 3.10 / 3.11 / 3.12
# Triggers: push to main/develop, all pull requests
# ─────────────────────────────────────────────────────────────────────────────

name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prevent Hatch from printing progress bars in CI output
  HATCH_VERBOSE: "1"

jobs:
  # ── 1. Lint & type-check (fast gate — runs before the full matrix) ──────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Ruff lint
        run: hatch run lint

      - name: Mypy type check
        run: hatch run typecheck

  # ── 2. Unit tests — no I/O, no API keys needed ───────────────────────────────
  unit-tests:
    name: Unit Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Run unit tests with coverage
        run: hatch run test-cov -m unit

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'   # upload once, from the canonical version
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
          fail_ci_if_error: false            # don't break CI if Codecov is down

  # ── 3. Integration tests — gated behind a secret ─────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run on push to main (not on every PR to avoid burning API quota)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit-tests
    environment: integration   # requires OPENAI_API_KEY secret in this environment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: hatch run test -m integration

  # ── 4. Build wheel — ensures pyproject.toml is always valid ─────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Build wheel + sdist
        run: hatch build

      - name: Check wheel metadata (twine)
        run: |
          pip install twine
          twine check dist/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 5. Publish to PyPI (manual trigger only) ─────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Trigger with: gh workflow run test.yml --ref main -f publish=true
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi   # requires PYPI_TOKEN secret

    permissions:
      id-token: write   # required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Publish via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed when using Trusted Publishing
